<section
  class="settings-page settings-search-page"
  id="settings"
  aria-labelledby="settings-title"
  x-data="citeloomSettingsPage"
  x-init="initialize()"
>
  <header class="settings-search-header">
    <div class="settings-search-heading">
      <h1 id="settings-title">Settings</h1>
      <p x-text="settings?.scope.kind === 'workspace' ? `Configure how ${settings.scope.label} uses search, answers, and audio.` : 'Choose the services and settings CiteLoom uses for search, answers, document processing, and audio.'">Choose the services and settings CiteLoom uses for search, answers, document processing, and audio.</p>
    </div>
    <div class="settings-header-actions compact-header-actions">
      <label class="settings-header-scope" x-cloak x-show="settings?.scope.available.length > 1">
        <span class="visually-hidden">Settings scope</span>
        <select
          class="form-control compact-header-control"
          aria-label="Settings scope"
          :disabled="loading || saving"
          :value="settings?.scope.id ?? ''"
          @change="changeSettingsTargetFromControl($event.target)"
        >
          <template x-for="scope in settings?.scope.available ?? []" :key="scope.id">
            <option :selected="scope.id === settings.scope.id" :value="scope.id" x-text="scope.label"></option>
          </template>
        </select>
      </label>
      <label class="search-control settings-search-input settings-header-search">
        <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
          <use href="./assets/images/citeloom-icons.svg#citeloom-search"></use>
        </svg>
        <span class="visually-hidden">Search settings</span>
        <input
          autocomplete="off"
          name="settings-search"
          placeholder="Search settings, features, providers..."
          type="search"
          x-model.debounce.150ms="query"
          @input="changeSearchQuery()"
        />
      </label>
      <label class="settings-header-source">
        <span class="visually-hidden">Filter setting source</span>
        <select
          class="form-control compact-header-control"
          aria-label="Filter setting source"
          :value="sourceFilter"
          @change="changeSourceFilter($event.target.value)"
        >
          <option value="all">All values</option>
          <option value="database" x-text="settings?.scope.kind === 'workspace' ? 'Workspace overrides' : 'Changed values'">Changed values</option>
          <option value="database-default" x-text="settings?.scope.kind === 'workspace' ? 'Organization defaults' : 'Default values'">Default values</option>
          <option value="modified">Unsaved changes</option>
        </select>
      </label>
      <button
        class="button secondary settings-all-areas compact-header-control"
        type="button"
        x-show="settings !== null &amp;&amp; !browsingAreas"
        @click="clearSearch()"
      >
        <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
          <use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use>
        </svg>
        <span>All areas</span>
      </button>
      <button
        class="button secondary settings-reset-action compact-header-control"
        type="button"
        :disabled="saving || settings === null"
        @click="resetAll()"
      >
        <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
          <use href="./assets/images/citeloom-icons.svg#citeloom-reset"></use>
        </svg>
        <span>Reset</span>
      </button>
      <button
        class="button primary compact-header-control compact-header-primary"
        type="button"
        :aria-busy="saving"
        :disabled="!canSave"
        @click="saveChanges()"
      >
        <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
          <use href="./assets/images/citeloom-icons.svg#citeloom-save"></use>
        </svg>
        <span x-text="saveLabel()">Save changes</span>
      </button>
    </div>
  </header>

  <div class="status-message settings-message error" role="alert" x-cloak x-show="errorMessage !== ''">
    <svg aria-hidden="true" class="citeloom-icon status-icon error">
      <use href="./assets/images/citeloom-icons.svg#citeloom-warning-circle"></use>
    </svg>
    <span x-text="errorMessage"></span>
    <button
      class="text-button citeloom-settings-retry"
      type="button"
      x-show="settings === null &amp;&amp; !loading"
      @click="loadSettings()"
    >Retry</button>
  </div>

  <div class="status-message settings-message success" role="status" x-cloak x-show="saved">
    <svg aria-hidden="true" class="citeloom-icon status-icon">
      <use href="./assets/images/citeloom-icons.svg#citeloom-status-check"></use>
    </svg>
    <span x-text="settings?.scope.kind === 'workspace' ? 'Workspace settings saved. New workspace requests use them immediately.' : 'Settings saved. New requests use them immediately.'">Settings saved. New requests use them immediately.</span>
  </div>

  <template x-if="settings !== null &amp;&amp; settings.warnings.length > 0">
    <div class="status-message settings-message warning" role="status">
      <svg aria-hidden="true" class="citeloom-icon status-icon">
        <use href="./assets/images/citeloom-icons.svg#citeloom-warning-circle"></use>
      </svg>
      <div>
        <template x-for="warning in settings.warnings" :key="warning">
          <p x-text="warning"></p>
        </template>
      </div>
    </div>
  </template>

  <p class="settings-loading" x-show="loading">Loading settings.</p>

  <template x-if="settings !== null">
  <div class="settings-search-layout">
    <datalist id="openai-codex-models">
      <template x-for="model in openAICodexModels" :key="model.id">
        <option :value="model.id" x-text="model.name"></option>
      </template>
    </datalist>
    <template x-if="browsingAreas">
    <section
      class="settings-area-browser"
      aria-labelledby="settings-area-browser-title"
    >
      <header>
        <h2 id="settings-area-browser-title">Browse by area</h2>
        <span x-text="`${areaCount} areas`"></span>
      </header>
      <div class="settings-area-grid">
        <button type="button" @click="selectArea('Application Features')">
          <svg aria-hidden="true" class="citeloom-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use>
          </svg>
          <span>
            <strong>Application Features</strong>
            <small x-text="`${featureCapabilities.length} features that use AI services`"></small>
          </span>
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
          </svg>
        </button>
        <button type="button" x-show="organizationSettingsVisible" @click="selectArea('Workspaces')">
          <svg aria-hidden="true" class="citeloom-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use>
          </svg>
          <span>
            <strong>Workspaces</strong>
            <small x-text="`${managedWorkspaces().length} active workspaces`"></small>
          </span>
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
          </svg>
        </button>
        <button type="button" x-show="workspaceManagementVisible" @click="selectArea('Workspace')">
          <svg aria-hidden="true" class="citeloom-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-user-plus"></use>
          </svg>
          <span>
            <strong>Workspace</strong>
            <small x-text="userManagementLoading ? `Manage ${settings.scope.label} details and access` : `${enabledWorkspaceUserCount()} of ${members.length} users enabled`"></small>
          </span>
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
          </svg>
        </button>
        <button type="button" x-show="organizationSettingsVisible" @click="selectArea('Providers')">
          <svg aria-hidden="true" class="citeloom-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use>
          </svg>
          <span>
            <strong>Providers</strong>
            <small>Connections and defaults</small>
          </span>
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
          </svg>
        </button>
        <button type="button" x-show="organizationSettingsVisible" @click="selectArea('Object storage')">
          <svg aria-hidden="true" class="citeloom-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-database"></use>
          </svg>
          <span>
            <strong>Object storage</strong>
            <small x-text="sourceContentStorage?.active.kind === 's3' ? 'S3-compatible storage active' : 'Local filesystem active'"></small>
          </span>
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
          </svg>
        </button>
        <button type="button" x-show="organizationSettingsVisible" @click="selectArea('Source libraries')">
          <svg aria-hidden="true" class="citeloom-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use>
          </svg>
          <span>
            <strong>Source libraries</strong>
            <small x-text="sourceLibraryAdministration === null ? 'Shared workspace sources' : `${sourceLibraryAdministration.libraries.length} shared libraries`"></small>
          </span>
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
          </svg>
        </button>
        <template x-for="group in groups" :key="group.name">
          <button type="button" @click="selectArea(group.name)">
            <svg aria-hidden="true" class="citeloom-icon">
              <use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use>
            </svg>
            <span>
              <strong x-text="group.name"></strong>
              <small x-text="formatSettingCount(group.fields.length)"></small>
            </span>
            <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
              <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
            </svg>
          </button>
        </template>
        <button type="button" x-show="organizationSettingsVisible" @click="selectArea('Startup and deployment')">
          <svg aria-hidden="true" class="citeloom-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use>
          </svg>
          <span>
            <strong>Startup and deployment</strong>
            <small x-text="`${settings.startupSettings.length} read-only values`"></small>
          </span>
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon">
            <use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use>
          </svg>
        </button>
      </div>
    </section>
    </template>

    <template x-if="selectedArea === 'Application Features'">
    <section class="settings-search-results settings-feature-workbench">
      <div class="settings-feature-health" aria-label="Configuration health">
        <div>
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use></svg>
          <span><strong x-text="`${featureCapabilities.length} application features`"></strong><small>Features that use an AI provider</small></span>
        </div>
        <div>
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-database"></use></svg>
          <span><strong x-text="`${settings.providers.catalog.length} providers available`"></strong><small>Available connections</small></span>
        </div>
        <div x-show="organizationSettingsVisible" :class="{ warning: featureWithoutCredentialCount() > 0 }">
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-warning-circle"></use></svg>
          <span><strong x-text="`${featureWithoutCredentialCount()} features without tokens`"></strong><small>Local providers may not require one</small></span>
        </div>
      </div>

      <div class="settings-feature-workspace">
        <aside class="settings-feature-sidebar">
          <header>
            <h2>Application Features</h2>
            <p>Select a feature to configure its provider and behavior.</p>
          </header>
          <nav aria-label="Application features">
            <template x-for="capability in featureCapabilities" :key="capability">
              <button
                type="button"
                :aria-current="capability === selectedFeatureCapability ? 'page' : null"
                :class="{ active: capability === selectedFeatureCapability }"
                @click="selectFeature(capability)"
              >
                <span class="settings-feature-icon">
                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use></svg>
                </span>
                <span class="settings-feature-nav-copy">
                  <span><strong x-text="capabilityLabel(capability)"></strong><small x-text="featureStateLabel(capability)"></small></span>
                  <span x-text="`${featureProviderLabel(capability)} · ${valueOrFallback(featureEffectiveModel(capability))}`"></span>
                </span>
              </button>
            </template>
          </nav>
        </aside>

        <section class="settings-feature-editor">
          <header class="settings-feature-editor-heading">
            <div>
              <span><h2 x-text="capabilityLabel(selectedFeatureCapability)"></h2><small x-text="featureStateLabel(selectedFeatureCapability)"></small></span>
              <p x-text="selectedFeatureDescription()"></p>
            </div>
            <span class="setting-source" :class="featureSourceClass(selectedFeatureCapability)" x-text="featureSourceLabel(selectedFeatureCapability)"></span>
          </header>

          <section class="settings-feature-step">
            <header><span>1</span><h3>Provider</h3></header>
            <div class="settings-feature-form-grid">
              <label class="form-field">
                <span>Provider</span>
                <select
                  :aria-label="`${capabilityLabel(selectedFeatureCapability)} provider`"
                  :value="featureProviderId(selectedFeatureCapability) ?? ''"
                  @change="writeFeatureProvider(selectedFeatureCapability, $event.target.value)"
                >
                  <template x-if="capabilityIsOptional(selectedFeatureCapability)"><option value="">Disabled</option></template>
                  <template x-if="!capabilityIsOptional(selectedFeatureCapability)"><option disabled value="">Select a provider</option></template>
                  <template x-for="provider in compatibleProviders(selectedFeatureCapability)" :key="provider.id">
                    <option
                      :selected="provider.id === featureProviderId(selectedFeatureCapability)"
                      :value="provider.id"
                      x-text="provider.displayName"
                    ></option>
                  </template>
                </select>
              </label>
              <div class="form-field settings-readonly-field settings-feature-url">
                <span>Provider URL</span>
                <output class="settings-readonly-control">
                  <code x-text="valueOrFallback(featureBaseUrl(selectedFeatureCapability), 'Not configured')"></code>
                </output>
                <small>Inherited from the selected provider connection.</small>
              </div>
            </div>
            <div class="settings-credential-warning" x-show="organizationSettingsVisible &amp;&amp; featureProviderId(selectedFeatureCapability) !== null &amp;&amp; !featureCredentialConfigured(selectedFeatureCapability)">
              <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-warning-circle"></use></svg>
              <span>No credential is configured for this feature. Local providers may not require one.</span>
              <button class="button secondary" type="button" @click="selectArea('Providers')">Configure credentials</button>
            </div>
            <p class="settings-boundary-note settings-feature-managed-note" x-show="!organizationSettingsVisible"><svg aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg><span>Provider connections and credentials are managed in organization settings. Workspace settings select among those connections without copying their secrets.</span></p>
          </section>

          <section class="settings-feature-step" x-show="featureConnection(selectedFeatureCapability) !== null">
            <header>
              <span>2</span>
              <h3 x-text="selectedFeatureCapability === 'embedding' ? 'Embedding model and space' : 'Model settings'"></h3>
              <p x-text="selectedFeatureCapability === 'embedding' ? 'Choose the model and application-wide embedding-space identity.' : 'Choose the model and limits used by this feature.'"></p>
            </header>
            <div class="settings-feature-form-grid">
              <label class="form-field">
                <span x-text="featureModelFieldLabel(selectedFeatureCapability)"></span>
                <input
                  :placeholder="featureModelInputPlaceholder(selectedFeatureCapability)"
                  type="text"
                  :list="providerUsesDeviceAuthentication(featureProviderId(selectedFeatureCapability)) ? 'openai-codex-models' : null"
                  :value="featureModelOverride(selectedFeatureCapability) ?? ''"
                  @input="writeFeatureModelOverride(selectedFeatureCapability, $event.target.value)"
                />
                <small x-text="featureModelFieldHelp(selectedFeatureCapability)"></small>
              </label>
              <label class="form-field" x-show="capabilityHasModelContext(selectedFeatureCapability)">
                <span>Maximum input tokens for this feature</span>
                <input
                  min="1"
                  placeholder="Use provider default"
                  step="1"
                  type="number"
                  :value="featureContextCapacityTokensOverride(selectedFeatureCapability) ?? ''"
                  @change="writeFeatureContextCapacityTokensOverride(selectedFeatureCapability, $event.target.value)"
                />
                <small x-text="featureContextCapacityTokensOverride(selectedFeatureCapability) === null ? 'The provider default is used.' : 'This limit is used for this feature instead of the provider default.'"></small>
              </label>
              <label class="form-field" x-cloak x-show="capabilitySupportsThinking(selectedFeatureCapability)">
                <span>Thinking mode for this feature</span>
                <select :disabled="!featureSendReasoningOptions(selectedFeatureCapability)" :value="featureThinkingModeOverride(selectedFeatureCapability) ?? ''" @change="writeFeatureThinkingModeOverride(selectedFeatureCapability, $event.target.value)">
                  <option value="">Inherit provider setting</option>
                  <option value="disabled">Disabled</option>
                  <option value="enabled">Enabled</option>
                  <option value="auto">Provider API default</option>
                </select>
                <small x-text="!featureSendReasoningOptions(selectedFeatureCapability) ? 'The selected provider omits reasoning controls.' : (featureThinkingModeOverride(selectedFeatureCapability) === null ? `Uses the provider setting: ${featureEffectiveThinkingMode(selectedFeatureCapability)}.` : `Uses this feature setting: ${featureEffectiveThinkingMode(selectedFeatureCapability)}.`)"></small>
              </label>
              <template x-if="selectedFeatureCapability === 'textToSpeech'">
                <label class="form-field">
                  <span>Voice for this feature</span>
                  <input placeholder="Use provider default" type="text" :value="featureVoiceOverride() ?? ''" @input="writeFeatureVoiceOverride($event.target.value)" />
                  <small x-text="featureVoiceOverride() === null ? 'The provider default voice is used.' : 'This voice is used instead of the provider default.'"></small>
                </label>
              </template>
              <template x-for="field in featurePrimaryFields(selectedFeatureCapability)" :key="field.key">
                <label class="form-field">
                  <span x-text="field.label"></span>
                  <template x-if="field.input === 'boolean'">
                    <select :value="String(drafts[field.key])" @change="writeFieldDraft(field, $event.target.value === 'true')">
                      <option value="true">True</option>
                      <option value="false">False</option>
                    </select>
                  </template>
                  <template x-if="field.input === 'select'">
                    <select @change="writeFieldDraft(field, $event.target.value)">
                      <template x-for="option in field.options" :key="String(option.value)"><option :selected="String(option.value) === String(drafts[field.key])" :value="String(option.value)" x-text="option.label"></option></template>
                    </select>
                  </template>
                  <template x-if="field.input !== 'boolean' &amp;&amp; field.input !== 'select'">
                    <input :type="field.input" :value="String(drafts[field.key])" @input="writeFieldDraft(field, $event.target.value)" />
                  </template>
                  <small x-text="field.description"></small>
                </label>
              </template>
            </div>
            <template x-if="selectedFeatureCapability === 'embedding'">
              <div class="settings-input-format-library settings-feature-input-format-library">
                <template x-if="selectedEmbeddingInputFormat() !== null">
                  <div class="settings-input-format-record">
                    <template x-for="format in [selectedEmbeddingInputFormat()]" :key="format.id">
                      <div>
                        <div class="settings-input-format-heading">
                          <h4>Format templates</h4>
                        </div>
                        <div class="settings-input-format-templates">
                          <div><span>Document template</span><code x-text="format.documentTemplate"></code></div>
                          <div><span>Query template</span><code x-text="format.queryTemplate"></code></div>
                        </div>
                        <div class="settings-input-format-actions">
                          <button class="settings-input-format-action settings-input-format-action-primary" type="button" :disabled="inputFormatBusy" @click="beginEmbeddingInputFormatCreate()">New format</button>
                          <button class="settings-input-format-action" type="button" :disabled="inputFormatBusy" @click="beginEmbeddingInputFormatCopy(format)">Copy</button>
                          <button class="settings-input-format-action" type="button" :disabled="inputFormatBusy" @click="beginEmbeddingInputFormatRevision(format)">Create revision</button>
                          <button class="settings-input-format-action settings-input-format-action-danger" type="button" x-show="format.canRetire" :disabled="inputFormatBusy" @click="retireEmbeddingInputFormat(format)">Retire format</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="inputFormatDraft !== null">
                  <form class="settings-input-format-editor" @submit.prevent="submitEmbeddingInputFormat()">
                    <header>
                      <h4 x-text="embeddingInputFormatEditorTitle()"></h4>
                      <p>Saving creates a new format. The original remains unchanged.</p>
                    </header>
                    <div class="settings-input-format-guidance">
                      <strong>Match the embedding model's instructions</strong>
                      <span>The document template prepares each searchable document section. The query template prepares each question or semantic search.</span>
                      <span>Use the exact prefixes required by the model and place one <code>{{text}}</code> where CiteLoom should insert the document section or question.</span>
                      <a class="text-action inline-help" data-view="help" href="./index.html?view=help#embedding-input-formats" hx-get="./fragments/help.html" hx-push-url="./index.html?view=help#embedding-input-formats">View examples and step-by-step guidance</a>
                    </div>
                    <label><span>Name</span><input maxlength="100" required type="text" x-model="inputFormatDraft.name" /><small>Use a recognizable name such as Acme Embed v2.</small></label>
                    <label><span>Format version</span><input min="1" required type="number" :readonly="inputFormatEditorMode === 'copy'" x-model="inputFormatDraft.schemaVersion" /><small>Use 1 for a new format. Increase it only when saving a changed version of an existing format.</small></label>
                    <label class="settings-input-format-template-field"><span>Document template</span><textarea maxlength="10000" required rows="3" :readonly="inputFormatEditorMode === 'copy'" x-model="inputFormatDraft.documentTemplate"></textarea><small>Applied to every searchable document section. Plain example: <code>{{text}}</code></small></label>
                    <label class="settings-input-format-template-field"><span>Query template</span><textarea maxlength="10000" required rows="3" :readonly="inputFormatEditorMode === 'copy'" x-model="inputFormatDraft.queryTemplate"></textarea><small>Applied to every question or semantic search. Use the exact template required by the selected model.</small></label>
                    <p>Both templates must contain exactly one <code>{{text}}</code> placeholder.</p>
                    <div class="settings-input-format-editor-actions"><button class="settings-input-format-action" type="button" :disabled="inputFormatBusy" @click="cancelEmbeddingInputFormatEditor()">Cancel</button><button class="settings-input-format-action settings-input-format-action-primary" type="submit" :disabled="inputFormatBusy" x-text="inputFormatBusy ? 'Saving' : 'Save format'"></button></div>
                  </form>
                </template>
              </div>
            </template>
            <div
              class="settings-embedding-space-impact"
              role="status"
              x-cloak
              x-show="selectedFeatureCapability === 'embedding' &amp;&amp; embeddingSpaceChangePending()"
            >
              <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-warning-circle"></use></svg>
              <div>
                <strong>Reindexing may be required</strong>
                <span x-text="embeddingSpaceImpactMessage()"></span>
              </div>
            </div>
          </section>

          <section class="settings-feature-step" x-show="featureConnection(selectedFeatureCapability) !== null">
            <header><span>3</span><h3>Settings in use</h3><p>These are the values CiteLoom will use.</p></header>
            <div class="settings-resolved-result" :class="{ 'settings-embedding-space-status': selectedFeatureCapability === 'embedding' }">
              <div><span>Selected model</span><code x-text="valueOrFallback(featureEffectiveModel(selectedFeatureCapability))"></code></div>
              <div><span>Model selection</span><strong x-text="featureModelSourceLabel(selectedFeatureCapability)"></strong></div>
              <template x-if="capabilityHasModelContext(selectedFeatureCapability)">
                <div><span>Maximum input</span><strong x-text="`${valueOrFallback(featureEffectiveContextCapacityTokens(selectedFeatureCapability))} tokens`"></strong></div>
              </template>
              <template x-if="selectedFeatureCapability === 'textToSpeech'">
                <div><span>Selected voice</span><code x-text="valueOrFallback(featureEffectiveVoice())"></code></div>
              </template>
              <template x-if="selectedFeatureCapability === 'embedding'">
                <div><span>Vector dimensions</span><strong x-text="settings.embeddingSpace.dimensions"></strong></div>

                  <select class="form-control compact-header-control access-user-row-control" :value="member.access" :disabled="userManagementBusy || member.globalRole === 'global_admin' || member.userId === currentUserId" @change="changeAccess(member, $event.target.value)" :aria-label="`Workspace access for ${member.username}`"><option value="enabled">Enabled</option><option value="disabled">Disabled</option></select>
                  <details class="access-user-actions" x-show="member.globalRole !== 'global_admin'" @click.outside="$el.open = false">

          </section>

          <div class="access-drawer-backdrop" x-cloak x-show="addMemberOpen" @click.self="closeAddMember()">

              <header><div><h2 id="add-member-title">Add user</h2><p>Give an existing CiteLoom account access to this workspace.</p></div><button class="button access-close-button" type="button" aria-label="Close add user form" @click="closeAddMember()"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-close"></use></svg></button></header>
              <form @submit.prevent="addWorkspaceMember()">
                <label><span>User</span><select required :value="selectedMemberCandidateId" :disabled="userManagementBusy || memberCandidates.length === 0" @change="selectMemberCandidate($event.target.value)"><option disabled value="">Select an existing user</option><template x-for="candidate in memberCandidates" :key="candidate.userId"><option :value="candidate.userId" x-text="`${candidate.displayName} (@${candidate.username})${candidate.state === 'pending' ? ' · Setup pending' : ''}${candidate.globalRole === 'global_admin' ? ' · Global administrator' : ''}`"></option></template></select><small x-show="memberCandidates.length > 0">Active and setup-pending accounts that are not already members are shown.</small><small x-show="memberCandidates.length === 0">Every available user is already a member of this workspace.</small></label>
                <label><span>Role</span><select x-model="memberRoleDraft" :disabled="userManagementBusy || selectedMemberCandidateIsGlobalAdministrator()"><option value="member">Member</option><option value="admin">Admin</option></select><small x-show="selectedMemberCandidateIsGlobalAdministrator()">Global administrators always have the Admin role.</small></label>
                <div class="access-drawer-guidance"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-info"></use></svg><p><strong>Role guidance</strong><span>Admins can manage users and roles. Members can use the workspace but cannot manage users.</span></p></div>
                <footer><button class="button access-secondary-button" :disabled="userManagementBusy" type="button" @click="closeAddMember()">Cancel</button><button class="button access-primary-button" :disabled="userManagementBusy || selectedMemberCandidateId === ''" type="submit" x-text="userManagementBusy ? 'Adding…' : 'Add to workspace'"></button></footer>
              </form>
            </aside>
          </div>
        </div>
      </div>
    </section>
    </template>

          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-status-check"></use></svg><span><strong x-text="currentWorkspaceName"></strong><small>Current application workspace</small></span></div>
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg><span><strong>Global administrator</strong><small>Can create and edit every workspace</small></span></div>

    <template x-if="selectedArea === 'Source libraries'">
    <section class="settings-search-results settings-source-library-workbench">
      <div class="status-message settings-message error" role="alert" x-cloak x-show="sourceLibraryAdministrationError !== ''">
        <svg aria-hidden="true" class="citeloom-icon status-icon error"><use href="./assets/images/citeloom-icons.svg#citeloom-warning-circle"></use></svg>
        <span x-text="sourceLibraryAdministrationError"></span>
        <button class="text-button citeloom-settings-retry" type="button" x-show="sourceLibraryAdministration === null &amp;&amp; !sourceLibraryAdministrationBusy" @click="loadSourceLibraryAdministration()">Retry</button>
      </div>

      <p class="settings-loading" x-show="sourceLibraryAdministration === null &amp;&amp; sourceLibraryAdministrationBusy">Loading source libraries.</p>

      <template x-if="sourceLibraryAdministration !== null">
      <div class="settings-administration-content">
        <div class="settings-feature-health" aria-label="Source library summary">
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg><span><strong x-text="sourceLibraryCountLabel(sourceLibraryActiveCount(), 'active shared library')"></strong><small>Organization-managed source collections</small></span></div>
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use></svg><span><strong x-text="sourceLibraryCountLabel(sourceLibraryAdministration.workspaces.length, 'workspace')"></strong><small>Available grant targets</small></span></div>
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-status-check"></use></svg><span><strong x-text="sourceLibraryCountLabel(sourceLibraryGrantCount(), 'active grant')"></strong><small>Use and manage assignments</small></span></div>
        </div>

        <div class="settings-administration-grid">
          <section class="settings-administration-create" aria-labelledby="settings-source-library-create-title">
            <header>
              <span class="settings-feature-icon"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg></span>
              <div><h2 id="settings-source-library-create-title">Create shared library</h2><p>Make one source collection available to selected workspaces.</p></div>
            </header>
            <form @submit.prevent="createSharedSourceLibrary()">
              <label class="form-field">
                <span>Library name</span>
                <input autocomplete="off" maxlength="200" placeholder="Common sources" required type="text" x-model="sourceLibraryNameDraft" />
                <small>Use a name that explains which content belongs here.</small>
              </label>
              <button class="button primary" type="submit" :aria-busy="sourceLibraryAdministrationBusy" :disabled="sourceLibraryAdministrationBusy || sourceLibraryNameDraft.trim() === ''">Create library</button>
            </form>
            <div class="settings-boundary-note">
              <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg>
              <span>The current workspace receives Manage access when the library is created. Other workspaces receive no access until you grant it.</span>
            </div>
          </section>

          <section class="settings-administration-list" aria-labelledby="settings-source-library-list-title">
            <header><div><h2 id="settings-source-library-list-title">Workspace access</h2><p>Choose whether each workspace can use shared sources or also upload and manage them.</p></div><span class="setting-source">Global administrator</span></header>
            <div class="settings-administration-empty" x-show="sourceLibraryAdministration.libraries.length === 0">
              <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg>
              <div><strong>No shared libraries yet</strong><span>Create one to share common sources without copying documents between workspaces.</span></div>
            </div>
            <div class="settings-administration-records" x-show="sourceLibraryAdministration.libraries.length > 0">
              <template x-for="library in sourceLibraryAdministration.libraries" :key="library.id">
                <article class="settings-administration-record" :class="{ archived: library.state !== 'active' }">
                  <header>
                    <div class="settings-administration-identity">
                      <div x-show="sourceLibraryRenamingId !== library.id">
                        <h3 x-text="library.name"></h3>
                        <p x-text="library.state === 'deleting' ? 'Permanent deletion is in progress' : library.state === 'archived' ? 'Hidden from all workspaces' : `${sourceLibraryGrantedWorkspaceCount(library)} of ${sourceLibraryAdministration.workspaces.length} workspaces have access`"></p>
                      </div>
                      <form class="settings-administration-rename" x-show="sourceLibraryRenamingId === library.id" @submit.prevent="renameSharedSourceLibrary(library)">
                        <label class="visually-hidden" :for="`source-library-name-${library.id}`">Library name</label>
                        <input :id="`source-library-name-${library.id}`" maxlength="200" required type="text" x-model="sourceLibraryRenameDraft" x-ref="sourceLibraryRenameInput" />
                        <button class="button primary" type="submit" :disabled="sourceLibraryAdministrationBusy || sourceLibraryRenameDraft.trim() === ''">Save</button>
                        <button class="button secondary" type="button" :disabled="sourceLibraryAdministrationBusy" @click="cancelRenamingSourceLibrary()">Cancel</button>
                      </form>
                    </div>
                    <div class="settings-administration-actions" x-show="sourceLibraryRenamingId !== library.id">
                      <span class="setting-source" x-text="library.state === 'deleting' ? 'Deleting' : library.state === 'archived' ? 'Archived' : 'Shared'"></span>
                      <button class="button secondary" type="button" x-show="library.state !== 'deleting'" :disabled="sourceLibraryAdministrationBusy" @click="startRenamingSourceLibrary(library)">Rename</button>
                      <button class="button secondary" type="button" x-show="library.state === 'active'" :disabled="sourceLibraryAdministrationBusy" @click="manageSourceLibraryDocuments(library)">Manage documents</button>
                      <button class="button danger" type="button" x-show="library.state === 'active'" :disabled="sourceLibraryAdministrationBusy" @click="archiveSharedSourceLibrary(library)">Archive</button>
                      <button class="button primary" type="button" x-show="library.state === 'archived'" :disabled="sourceLibraryAdministrationBusy" @click="restoreSharedSourceLibrary(library)">Restore</button>
                      <button class="button danger" type="button" x-show="library.state === 'active' || library.state === 'archived'" :disabled="sourceLibraryAdministrationBusy" @click="deleteSharedSourceLibrary(library)">Delete permanently</button>
                    </div>
                  </header>
                  <div class="settings-administration-archived-note" x-show="library.state === 'archived'">
                    Documents and workspace access assignments are retained. Restore the library to make it available again.
                  </div>
                  <div class="settings-administration-archived-note" role="status" x-show="library.state === 'deleting'">
                    CiteLoom is permanently deleting this library, its documents, and its workspace access assignments. Cleanup resumes automatically after a restart.
                  </div>
                  <div class="settings-source-library-grants" x-show="library.state === 'active'">
                    <template x-for="workspace in sourceLibraryAdministration.workspaces" :key="workspace.id">
                      <label>
                        <span><strong x-text="workspace.name"></strong><small x-text="sourceLibraryWorkspaceAccess(library, workspace.id) === 'manage' ? 'Can find, upload, and manage sources' : sourceLibraryWorkspaceAccess(library, workspace.id) === 'use' ? 'Can find and use sources' : 'Cannot access this library'"></small></span>
                        <select class="form-control compact-header-control" :aria-label="`${workspace.name} access to ${library.name}`" :disabled="sourceLibraryAdministrationBusy" x-model="sourceLibraryGrantDrafts[sourceLibraryGrantDraftKey(library.id, workspace.id)]" @change="changeSourceLibraryGrant(library, workspace)">
                          <option value="none">No access</option>
                          <option value="use">Use</option>
                          <option value="manage">Manage</option>
                        </select>
                      </label>
                    </template>
                  </div>
                </article>
              </template>
            </div>
          </section>
        </div>
      </div>
      </template>
    </section>
    </template>

    <template x-if="selectedArea === 'Object storage'">
    <section class="settings-search-results settings-storage-workbench">
      <div class="status-message settings-message error" role="alert" x-cloak x-show="sourceContentStorageError !== ''">
        <svg aria-hidden="true" class="citeloom-icon status-icon error"><use href="./assets/images/citeloom-icons.svg#citeloom-warning-circle"></use></svg>
        <span x-text="sourceContentStorageError"></span>
      </div>

      <p class="settings-loading" x-show="sourceContentStorage === null">Loading object storage settings.</p>

      <template x-if="sourceContentStorage !== null &amp;&amp; sourceContentStorageDraft !== null">
      <div class="settings-storage-content">
        <div class="settings-feature-health" aria-label="Object storage summary">
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-database"></use></svg><span><strong x-text="sourceContentStorage.active.kind === 's3' ? 'S3-compatible storage' : 'Local filesystem'"></strong><small>Active source-content backend</small></span></div>
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use></svg><span><strong x-text="`${sourceContentStorage.documentCount} documents`"></strong><small>Registered source objects</small></span></div>
          <div :class="{ warning: sourceContentMigrationActive() }"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-status-check"></use></svg><span><strong x-text="sourceContentMigrationActive() ? sourceContentMigrationStateLabel() : 'Ready'"></strong><small>Migration status</small></span></div>
        </div>

        <div class="settings-storage-grid">
          <section class="settings-storage-active" aria-labelledby="settings-storage-active-title">
            <header><span class="settings-feature-icon"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-database"></use></svg></span><div><h2 id="settings-storage-active-title">Active storage</h2><p>New reads, writes, and deletions use this backend.</p></div></header>
            <dl>
              <div><dt>Backend</dt><dd x-text="sourceContentStorage.active.kind === 's3' ? 'S3-compatible' : 'Filesystem'"></dd></div>
              <template x-if="sourceContentStorage.active.kind === 'filesystem'"><div><dt>Directory</dt><dd><code x-text="sourceContentStorage.active.directory"></code></dd></div></template>
              <template x-if="sourceContentStorage.active.kind === 's3'"><div><dt>Endpoint</dt><dd><code x-text="sourceContentStorage.active.endpointUrl"></code></dd></div></template>
              <template x-if="sourceContentStorage.active.kind === 's3'"><div><dt>Bucket and prefix</dt><dd><code x-text="`${sourceContentStorage.active.bucket}/${sourceContentStorage.active.prefix}`"></code></dd></div></template>
              <template x-if="sourceContentStorage.active.kind === 's3'"><div><dt>Credentials</dt><dd x-text="sourceContentStorage.active.credentialSource === 'environment' ? 'Deployment environment' : 'Stored static credentials'"></dd></div></template>
            </dl>
            <p class="settings-boundary-note"><svg aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg><span>This page configures CiteLoom's connection. SeaweedFS server credentials, ports, and data directories remain deployment-controlled.</span></p>
          </section>

          <section class="settings-storage-editor" aria-labelledby="settings-storage-editor-title">
            <header><div><h2 id="settings-storage-editor-title">Migration target</h2><p>Test a destination, then start a verified background migration.</p></div><span class="setting-source" x-text="sourceContentStorageDraftMatchesActive() ? 'Already active' : 'Administrator'"></span></header>

            <label class="form-field">
              <span>Backend</span>
              <select :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.kind" @change="changeSourceContentStorageKind($event.target.value)">
                <option value="filesystem">Local filesystem</option>
                <option value="s3">S3-compatible object storage</option>
              </select>
            </label>

            <template x-if="sourceContentStorageDraft.kind === 'filesystem'">
              <label class="form-field settings-storage-wide-field">
                <span>Absolute directory</span>
                <input autocomplete="off" type="text" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.directory" @input="writeSourceContentStorageDraft('directory', $event.target.value)" />
                <small>The directory must be mounted in both the web and worker containers.</small>
              </label>
            </template>

            <template x-if="sourceContentStorageDraft.kind === 's3'">
            <div class="settings-storage-s3-fields">
              <label class="form-field settings-storage-wide-field"><span>Endpoint URL</span><input autocomplete="url" type="url" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.endpointUrl" @input="writeSourceContentStorageDraft('endpointUrl', $event.target.value)" /><small>For bundled SeaweedFS, use <code>http://seaweedfs:8333</code>.</small></label>
              <label class="form-field"><span>Bucket</span><input autocomplete="off" type="text" maxlength="63" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.bucket" @input="writeSourceContentStorageDraft('bucket', $event.target.value)" /></label>
              <label class="form-field"><span>Object key prefix</span><input autocomplete="off" type="text" maxlength="512" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.prefix" @input="writeSourceContentStorageDraft('prefix', $event.target.value)" /></label>
              <label class="form-field"><span>Signing region</span><input autocomplete="off" type="text" maxlength="100" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.region" @input="writeSourceContentStorageDraft('region', $event.target.value)" /><small>This signs S3 requests and does not select where SeaweedFS stores data.</small></label>
              <label class="form-field"><span>Credential source</span><select :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.credentialSource" @change="writeSourceContentStorageDraft('credentialSource', $event.target.value)"><option value="environment">Deployment environment</option><option value="static">Enter static credentials</option></select></label>
              <template x-if="sourceContentStorageDraft.credentialSource === 'static'">
              <div class="settings-storage-credential-fields">
                <label class="form-field"><span>Access key ID</span><input autocomplete="off" type="password" maxlength="256" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.accessKeyId" @input="writeSourceContentStorageDraft('accessKeyId', $event.target.value)" /></label>
                <label class="form-field"><span>Secret access key</span><input autocomplete="new-password" type="password" maxlength="4096" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" :value="sourceContentStorageDraft.secretAccessKey" @input="writeSourceContentStorageDraft('secretAccessKey', $event.target.value)" /></label>
                <small>Credentials are write-only and are never returned by the API or included in migration status.</small>
              </div>
              </template>
              <label class="toggle-control settings-toggle-control settings-storage-path-style"><input type="checkbox" :checked="sourceContentStorageDraft.forcePathStyle" :disabled="sourceContentMigrationActive() || sourceContentStorageBusy" @change="writeSourceContentStorageDraft('forcePathStyle', $event.target.checked)" /><span><strong>Use path-style URLs</strong><small>Required by bundled SeaweedFS and many self-hosted S3 services.</small></span></label>
            </div>
            </template>

            <div class="settings-storage-probe-status" :class="{ ready: sourceContentStorageStatusReady() }" role="status">
              <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use :href="sourceContentStorageStatusReady() ? './assets/images/citeloom-icons.svg#citeloom-status-check' : './assets/images/citeloom-icons.svg#citeloom-warning-circle'"></use></svg>
              <span x-text="sourceContentStorageStatusMessage()"></span>
            </div>

            <footer class="settings-storage-actions">
              <button class="button secondary" type="button" :disabled="sourceContentStorageBusy || sourceContentMigrationActive() || sourceContentStorageDraftMatchesActive()" @click="resetSourceContentStorageDraft()">Reset</button>
              <button class="button secondary" type="button" :aria-busy="sourceContentStorageBusy" :disabled="sourceContentStorageBusy || sourceContentMigrationActive()" @click="testSourceContentStorage()">Test connection</button>
              <button class="button primary" type="button" :disabled="sourceContentStorageBusy || sourceContentMigrationActive() || sourceContentStorageDraftMatchesActive() || !sourceContentStorageProbePassed" @click="startSourceContentMigration()">Start migration</button>
            </footer>
          </section>
        </div>

        <template x-if="sourceContentStorage.migration !== null">
        <section class="settings-storage-migration" :class="`state-${sourceContentStorage.migration.state}`" aria-live="polite">
          <header><div><span>Latest migration</span><h2 x-text="sourceContentMigrationStateLabel()"></h2></div><strong x-text="`${sourceContentMigrationProgress()}%`"></strong></header>
          <progress max="100" :value="sourceContentMigrationProgress()"></progress>
          <div class="settings-storage-migration-counts"><span><strong x-text="sourceContentStorage.migration.copiedDocuments"></strong> copied and verified</span><span><strong x-text="sourceContentStorage.migration.verifiedDocuments"></strong> verified at cutover</span><span><strong x-text="sourceContentStorage.migration.attemptCount"></strong> worker attempts</span></div>
          <p class="settings-storage-migration-error" x-show="sourceContentStorage.migration.errorMessage !== null" x-text="sourceContentStorage.migration.errorMessage"></p>
          <p class="settings-storage-retention-note" x-show="sourceContentStorage.migration.state === 'completed'"><strong>Previous backend retained.</strong> It is available for a reverse migration but is not synchronized with new writes or deletions.</p>
          <footer x-show="sourceContentMigrationCancellable()"><button class="button danger" type="button" :disabled="sourceContentStorageBusy" @click="cancelSourceContentMigration()">Cancel migration</button></footer>
        </section>
        </template>
      </div>
      </template>
    </section>
    </template>

    <template x-if="selectedArea === 'Startup and deployment'">
    <section class="settings-search-results settings-feature-workbench settings-startup-workbench">
      <div class="settings-feature-health" aria-label="Startup configuration summary">
        <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg><span><strong x-text="`${settings.startupSettings.length} startup values`"></strong><small>Set when CiteLoom starts</small></span></div>
        <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-status-check"></use></svg><span><strong>Read-only here</strong><small>Restart CiteLoom after changing them</small></span></div>
        <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-database"></use></svg><span><strong>Environment source</strong><small>Change through deployment configuration</small></span></div>
      </div>

      <div class="settings-feature-workspace">
        <aside class="settings-feature-sidebar settings-startup-sidebar">
          <header><h2>Startup and deployment</h2><p>Select a value to see its current setting.</p></header>
          <nav aria-label="Startup and deployment settings">
          <template x-for="field in settings.startupSettings" :key="field.key">
            <button type="button" :aria-current="field.key === activeStartupSetting()?.key ? 'page' : null" :class="{ active: field.key === activeStartupSetting()?.key }" @click="selectStartupSetting(field.key)">
              <span class="settings-feature-icon"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg></span>
              <span class="settings-feature-nav-copy"><span><strong x-text="field.label"></strong><small>Read-only</small></span><span x-text="field.value"></span></span>
            </button>
          </template>
          </nav>
        </aside>

        <template x-if="activeStartupSetting() !== null">
        <section class="settings-feature-editor settings-startup-editor">
          <template x-for="field in [activeStartupSetting()]" :key="field.key">
          <div>
            <header class="settings-feature-editor-heading"><div><span><h2 x-text="field.label"></h2><small>Startup and deployment</small></span><p x-text="field.description"></p></div><span class="setting-source">Deployment</span></header>
            <section class="settings-feature-step"><header><span>1</span><h3>Current value</h3><p>CiteLoom loaded this value when it started.</p></header><div class="settings-startup-value"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg><div><span>Current value</span><code :title="field.value" x-text="field.value"></code></div></div></section>
            <section class="settings-feature-step"><header><span>2</span><h3>How to change it</h3></header><p class="settings-startup-guidance">Update this value in the deployment environment, then restart CiteLoom so startup validation can load the new configuration.</p></section>
            <footer class="settings-readonly-footer"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg><strong>Read-only on this page</strong><span>Change this value in the deployment environment and restart CiteLoom.</span></footer>
          </div>
          </template>
        </section>
        </template>
      </div>
    </section>
    </template>

    <template x-if="!browsingAreas &amp;&amp; selectedArea !== 'Application Features' &amp;&amp; selectedArea !== 'Providers' &amp;&amp; selectedArea !== 'Object storage' &amp;&amp; selectedArea !== 'Source libraries' &amp;&amp; selectedArea !== 'Workspace' &amp;&amp; selectedArea !== 'Workspaces' &amp;&amp; selectedArea !== 'Startup and deployment'">
    <section class="settings-search-results settings-feature-workbench settings-runtime-workbench" aria-live="polite">
      <div class="empty-state settings-empty-results" x-show="filteredFields.length === 0">
        <svg aria-hidden="true" class="citeloom-icon">
          <use href="./assets/images/citeloom-icons.svg#citeloom-search"></use>
        </svg>
        <strong>No settings match</strong>
        <span>Try a broader term or clear the source filter.</span>
      </div>

      <div class="settings-runtime-content" x-show="filteredFields.length > 0">
        <div class="settings-feature-health" aria-label="Setting summary">
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use></svg><span><strong x-text="formatSettingCount(filteredFields.length)"></strong><small x-text="resultLabel()"></small></span></div>
          <div><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-database"></use></svg><span><strong x-text="`${filteredFieldSourceCount('database')} changed values`"></strong><small x-text="`${filteredFieldSourceCount('database-default')} default values`"></small></span></div>
          <div :class="{ warning: filteredPendingCount() > 0 }"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-status-check"></use></svg><span><strong x-text="`${filteredPendingCount()} pending changes`"></strong><small>Changes in this area</small></span></div>
        </div>

        <div class="settings-feature-workspace">
          <aside class="settings-feature-sidebar settings-runtime-sidebar">
            <header><h2 x-text="resultLabel()"></h2><p x-text="areaDescription()"></p></header>
            <nav aria-label="Application settings">
              <template x-for="panel in filteredRuntimePanels" :key="panel.id">
                <button type="button" :aria-current="panel.id === activeRuntimePanel()?.id ? 'page' : null" :class="{ active: panel.id === activeRuntimePanel()?.id }" @click="selectRuntimePanel(panel.id)">
                  <span class="settings-feature-icon"><svg aria-hidden="true" class="citeloom-icon"><use :href="runtimePanelIcon(panel)"></use></svg></span>
                  <span class="settings-feature-nav-copy"><span><strong x-text="panel.label"></strong><small x-text="runtimePanelBadgeLabel(panel)"></small></span><span x-text="panel.description"></span></span>
                </button>
              </template>
            </nav>
          </aside>

          <template x-for="panel in activeRuntimePanelSelection()" :key="panel.id">
          <section class="settings-feature-editor settings-runtime-editor" :class="{ 'settings-runtime-editor-docling': isDoclingPanel(panel), 'settings-runtime-editor-docling-pdf': isDoclingPdfPanel(panel) }">
            <div>
              <header class="settings-feature-editor-heading"><div><span><h2 x-text="panel.label"></h2><small x-text="panel.fields[0].group"></small></span><p x-text="panel.description"></p></div><span class="setting-source" :class="runtimePanelBadgeClass(panel)" x-text="runtimePanelBadgeLabel(panel)"></span></header>
              <section class="settings-feature-step">
                <header><span>1</span><h3 x-text="isDoclingPdfPanel(panel) ? 'Mode and content extraction' : (runtimeVisiblePanelFields(panel).length === 1 ? 'Setting value' : 'Setting values')"></h3><p x-text="isDoclingPdfPanel(panel) ? 'Choose how Docling reads and processes new PDF documents.' : (runtimeVisiblePanelFields(panel).length === 1 ? 'Change the value used by new requests.' : 'Change the values used by new requests.')"></p></header>
                <div class="application-feature-settings settings-runtime-panel-fields">
                  <template x-for="field in runtimeVisiblePanelFields(panel)" :key="field.key">
                    <div class="settings-runtime-field-entry" :class="{ 'settings-runtime-field-entry-wide': runtimeFieldIsWide(field) }">
                      <div class="settings-runtime-section-heading" x-show="runtimeFieldStartsSection(field)"><strong>Content extraction</strong><span>Control the content Docling extracts when Standard processing is selected.</span></div>
                    <div class="settings-field">
                      <div class="settings-field-heading"><label :for="`setting-${field.key}`" x-text="field.label"></label><span class="setting-source" :class="fieldSourceClass(field)" x-text="fieldSourceLabel(field)"></span></div>
                      <p x-show="panel.fields.length > 1" x-text="field.description"></p>
                      <div class="settings-control-row">
                        <template x-if="field.key === 'doclingPipeline'"><div class="settings-docling-mode-control" :id="`setting-${field.key}`" role="group" aria-label="Docling processing mode"><button type="button" :aria-pressed="drafts[field.key] === 'standard'" :class="{ active: drafts[field.key] === 'standard' }" @click="writeFieldDraft(field, 'standard')"><span><strong>Standard</strong><small>Faster text-based processing</small></span><svg x-show="drafts[field.key] === 'standard'" aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-check-circle"></use></svg></button><button type="button" :aria-pressed="drafts[field.key] === 'vlm'" :class="{ active: drafts[field.key] === 'vlm' }" @click="writeFieldDraft(field, 'vlm')"><span><strong>VLM</strong><small>Visual page understanding</small></span><svg x-show="drafts[field.key] === 'vlm'" aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-check-circle"></use></svg></button></div></template>
                        <template x-if="field.input === 'boolean'"><select class="form-control" :id="`setting-${field.key}`" :value="String(drafts[field.key])" @change="writeFieldDraft(field, $event.target.value === 'true')"><option value="true">Enabled</option><option value="false">Disabled</option></select></template>
                        <template x-if="field.input === 'select' &amp;&amp; field.key !== 'doclingPipeline'"><select class="form-control" :id="`setting-${field.key}`" :value="String(drafts[field.key])" @change="writeFieldDraft(field, $event.target.value)"><template x-for="option in field.options" :key="String(option.value)"><option :selected="String(option.value) === String(drafts[field.key])" :value="String(option.value)" x-text="option.label"></option></template></select></template>
                        <template x-if="field.input !== 'boolean' &amp;&amp; field.input !== 'select'"><input class="form-control" :autocomplete="field.sensitive ? 'new-password' : 'off'" :data-1p-ignore="field.sensitive ? 'true' : null" :data-bwignore="field.sensitive ? 'true' : null" :data-lpignore="field.sensitive ? 'true' : null" :id="`setting-${field.key}`" :max="field.max" :min="field.min" :name="`setting-${field.key}`" :placeholder="field.sensitive &amp;&amp; field.configured ? 'Configured' : ''" :step="field.step" :type="field.input" :value="String(drafts[field.key])" @input="writeFieldDraft(field, $event.target.value)" /></template>
                        <span class="setting-unit" x-show="field.unit !== null" x-text="field.unit"></span>
                      </div>
                      <small class="settings-runtime-credential-note" x-show="fieldCredentialMessageVisible(field)">A credential is configured. Enter a new value to replace it.</small>
                    </div>
                    </div>
                  </template>
                </div>
                <div class="settings-docling-advanced" x-show="isDoclingPdfPanel(panel)"><button type="button" :aria-expanded="doclingAdvancedExpanded" @click="toggleDoclingAdvanced()"><svg aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use></svg><span><strong x-text="doclingAdvancedExpanded ? 'Hide advanced processing settings' : 'Show advanced processing settings'"></strong><small>VLM instructions, output limit, PDF reader, and document heading controls</small></span></button></div>
              </section>
              <section class="settings-feature-step">
                <header>
                  <span>2</span>
                  <h3>What to expect</h3>
                  <p>How this setting can affect results, speed, or computer use.</p>
                </header>
                <div class="settings-resolved-result settings-runtime-guidance">
                  <template x-if="isDoclingPdfPanel(panel)"><div class="settings-docling-guidance"><span>Selected processing mode</span><strong x-text="doclingPipelineGuidance()"></strong></div></template>
                  <template x-for="field in isDoclingPdfPanel(panel) ? [] : runtimeVisiblePanelFields(panel)" :key="field.key">
                    <div><span x-text="field.label"></span><strong x-text="field.changeExample"></strong></div>
                  </template>
                </div>
              </section>
              <footer class="settings-feature-footer"><span :class="{ changed: changeCount > 0 }"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-status-check"></use></svg><strong x-text="changeSummaryLabel()"></strong></span><div><button class="button secondary" type="button" :disabled="saving" @click="resetRuntimeContext()">Reset</button><button class="button primary" type="button" :disabled="!canSave" @click="saveChanges()"><svg aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-save"></use></svg><span x-text="saveLabel()"></span></button></div></footer>
            </div>
          </section>
          </template>
        </div>
      </div>
    </section>
    </template>
  </div>
  </template>

  <div
    class="dialog-backdrop creation-modal-backdrop"
    x-cloak
    x-show="workspaceCreateOpen"
    @click.self="closeWorkspaceCreate()"
    @keydown.escape.window="workspaceCreateOpen &amp;&amp; closeWorkspaceCreate()"
  >
    <form
      aria-describedby="workspace-create-description"
      aria-labelledby="workspace-create-title"
      aria-modal="true"
      class="dialog creation-modal"
      role="dialog"
      x-ref="workspaceCreateDialog"
      :aria-busy="workspaceActionBusy"
      @keydown.tab="cycleWorkspaceCreateFocus($event)"
      @submit.prevent="createWorkspace()"
    >
      <header class="creation-modal-header">
        <div>
          <h2 class="section-kicker" id="workspace-create-title">Create workspace</h2>
          <p class="creation-modal-description" id="workspace-create-description">Every global administrator will be added as a workspace administrator.</p>
        </div>
        <button aria-label="Close workspace form" class="icon-button creation-modal-close" :disabled="workspaceActionBusy" type="button" @click="closeWorkspaceCreate()">
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-close"></use></svg>
        </button>
      </header>
      <label class="form-field">
        <span>Name</span>
        <input class="form-control" x-ref="workspaceCreateName" aria-describedby="workspace-create-name-help workspace-create-name-error" :aria-invalid="(workspaceNameValidationMessage(workspaceCreateName) !== '').toString()" maxlength="200" required type="text" x-model.trim="workspaceCreateName" @input="workspaceCreateError = ''" />
        <small id="workspace-create-name-help">The name shown to workspace members.</small>
        <small class="creation-modal-field-error" id="workspace-create-name-error" role="alert" x-show="workspaceNameValidationMessage(workspaceCreateName) !== ''" x-text="workspaceNameValidationMessage(workspaceCreateName)"></small>
      </label>
      <fieldset class="workspace-create-configuration">
        <legend>Initial settings</legend>
        <label class="workspace-create-configuration-option" :class="{ selected: workspaceCreateConfigurationKind === 'organization-defaults' }">
          <input name="workspace-configuration" type="radio" value="organization-defaults" x-model="workspaceCreateConfigurationKind" @change="workspaceCreateError = ''" />
          <span><strong>Use organization defaults</strong><small>Inherit current defaults and future organization changes.</small></span>
        </label>
        <label class="workspace-create-configuration-option" :class="{ selected: workspaceCreateConfigurationKind === 'workspace-copy' }">
          <input name="workspace-configuration" type="radio" value="workspace-copy" x-model="workspaceCreateConfigurationKind" @change="workspaceCreateError = ''" />
          <span><strong>Copy workspace settings</strong><small>Start with another workspace's explicit overrides.</small></span>
        </label>
        <label class="form-field workspace-create-source" x-show="workspaceCreateConfigurationKind === 'workspace-copy'">
          <span>Copy from</span>
          <select class="form-control" aria-describedby="workspace-create-source-help workspace-create-source-error" :aria-invalid="(workspaceCreateSourceValidationMessage() !== '').toString()" :disabled="managedWorkspaces().length === 0" :required="workspaceCreateConfigurationKind === 'workspace-copy'" x-model="workspaceCreateSourceWorkspaceId" @change="workspaceCreateError = ''">
            <template x-for="workspace in managedWorkspaces()" :key="workspace.id">
              <option :value="workspace.id" x-text="workspace.name"></option>
            </template>
          </select>
          <small id="workspace-create-source-help">Provider credentials and infrastructure remain organization-managed.</small>
          <small class="creation-modal-field-error" id="workspace-create-source-error" role="alert" x-show="workspaceCreateSourceValidationMessage() !== ''" x-text="workspaceCreateSourceValidationMessage()"></small>
        </label>
      </fieldset>
      <p class="creation-modal-error" role="alert" x-show="workspaceCreateError" x-text="workspaceCreateError"></p>
      <footer class="dialog-actions creation-modal-actions">
        <button class="button secondary" :disabled="workspaceActionBusy" type="button" @click="closeWorkspaceCreate()">Cancel</button>
        <button class="button primary" :disabled="!workspaceCreateCanSubmit()" type="submit" x-text="workspaceActionBusy ? 'Creating…' : 'Create workspace'"></button>
      </footer>
    </form>
  </div>
</section>
