<section class="access-page access-hub" x-data="citeloomAccountPage" x-init="initialize()">
  <header class="access-header">
    <p class="section-kicker">Personal security</p>
    <h1>My account</h1>
    <p>Manage your sign-in password.</p>
  </header>

  <p class="field-error" role="alert" x-cloak x-show="!passwordFormOpen &amp;&amp; errorMessage !== ''" x-text="errorMessage"></p>

  <section class="access-security-panel access-card">
    <div class="access-security-summary">
      <span class="access-feature-icon"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-lock"></use></svg></span>
      <div class="access-security-copy">
        <h2>Your security</h2>
        <p>Keep your CiteLoom account secure with a strong password.</p>
      </div>
      <div class="access-security-detail"><span>Password</span><strong><i class="access-status-dot"></i>Protected</strong></div>
      <div class="access-security-detail"><span>Requirement</span><strong x-text="passwordRequirementSummary"></strong></div>
      <button class="button access-secondary-button" :disabled="minimumPasswordLength === null" type="button" x-show="!passwordFormOpen" @click="openPasswordForm()">Change password</button>
    </div>
  </section>

  <div class="access-drawer-backdrop" x-cloak x-show="passwordFormOpen" @click.self="closePasswordForm()">
    <aside class="access-add-drawer access-password-drawer" role="dialog" aria-modal="true" aria-labelledby="change-password-title">
      <header>
        <div><h2 id="change-password-title">Change password</h2><p>Enter your current password, then choose a new one.</p></div>
        <button class="button access-close-button" type="button" aria-label="Close password form" @click="closePasswordForm()"><svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-close"></use></svg></button>
      </header>
      <form class="access-password-form" @submit.prevent="changePassword()">
        <p class="field-error" role="alert" x-cloak x-show="errorMessage !== ''" x-text="errorMessage"></p>
        <div class="access-password-grid">
          <label class="access-current-password"><span>Current password</span><input autocomplete="current-password" required type="password" x-model="currentPassword" /></label>
          <label><span>New password</span><input autocomplete="new-password" :minlength="minimumPasswordLength" required type="password" x-model="newPassword" /><small x-text="passwordRequirementSummary"></small></label>
          <label><span>Confirm new password</span><input autocomplete="new-password" :minlength="minimumPasswordLength" required type="password" x-model="confirmation" /></label>
        </div>
        <footer><button class="button access-secondary-button" :disabled="busy" type="button" @click="closePasswordForm()">Cancel</button><button class="button access-primary-button" :disabled="busy" type="submit" x-text="busy ? 'Saving…' : 'Change password'"></button></footer>
      </form>
    </aside>
  </div>
</section>
