<section
  class="chat-feature-page"
  x-data="citeloomChatPage"
  x-init="initialize()"
  @keydown.meta.k.window.prevent="toggleChatSwitcher()"
  @keydown.ctrl.k.window.prevent="toggleChatSwitcher()"
  @keydown.escape.window="chatSwitcherOpen ? closeChatSwitcher() : (selectedCitation !== null &amp;&amp; !newChatOpen &amp;&amp; closeCitation())"
>
  <main class="chat-workspace">
    <template x-if="conversation === null">
      <section class="empty-state chat-empty-state">
        <span class="chat-empty-icon">
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-ask"></use></svg>
        </span>
        <h2>Start a grounded conversation</h2>
        <p>Chat answers only from indexed documents and keeps the cited evidence with the conversation.</p>
        <button class="chat-primary-button" type="button" @click="openNewChat()">Create a chat</button>
      </section>
    </template>

    <template x-if="conversation !== null">
      <div class="chat-conversation">
        <header class="chat-conversation-header">
          <div class="chat-context-bar">
            <div class="chat-context-primary">
              <div class="chat-conversation-title" :title="conversation.title">
                <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-ask"></use></svg>
                <span x-text="conversation.title"></span>
              </div>
              <div class="chat-context-actions">
                <button
                  class="chat-context-icon-button"
                  type="button"
                  aria-label="New chat"
                  title="New chat"
                  @click="openNewChat()"
                >
                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-ask"></use></svg>
                  <span>New chat</span>
                </button>
                <button
                  class="chat-context-icon-button danger"
                  type="button"
                  aria-label="Delete chat"
                  title="Delete chat"
                  :disabled="busy"
                  @click="deleteConversation()"
                >
                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-trash"></use></svg>
                  <span>Delete chat</span>
                </button>
              </div>
            </div>
            <div class="chat-context-metadata">
              <div class="chat-context-scope">
                <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg>
                <div class="chat-context-copy">
                  <span class="chat-context-label">Search scope</span>
                  <strong x-text="scopeLabel()"></strong>
                </div>
              </div>
              <div
                class="chat-context-verification chat-verification-status"
                :class="`chat-verification-status-${conversationVerificationState()}`"
                x-cloak
                x-show="conversationVerificationVisible()"
                :title="conversationVerificationLabel()"
                aria-live="polite"
              >
                <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-shield-check"></use></svg>
                <div class="chat-context-copy">
                  <span class="chat-context-label">Answer status</span>
                  <span
                    class="chat-verification-status-label"
                    x-text="conversationVerificationStatusLabel()"
                  ></span>
                </div>
                <span
                  class="chat-verification-progress"
                  :class="`chat-verification-progress-${conversationVerificationState()}`"
                  role="progressbar"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  :aria-valuenow="conversationVerificationProgressValue()"
                  :aria-valuetext="conversationVerificationLabel()"
                  :aria-label="conversationVerificationLabel()"
                >
                  <span></span>
                </span>
              </div>
            </div>
          </div>
        </header>

        <div
          class="chat-thread"
          x-ref="thread"
          aria-live="polite"
          @scroll.passive="handleThreadScroll()"
        >
          <template x-for="run in conversation.runs" :key="run.id">
            <article class="chat-turn" data-evidence-window-anchor>
              <template x-for="message in run.messages" :key="`${run.id}-${message.role}`">
                <div class="chat-message" :class="`chat-message-${message.role}`">
                  <template x-if="message.role === 'user'">
                    <div class="chat-user-message">
                      <header>
                        <span class="chat-user-avatar">
                          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-user-edit"></use></svg>
                        </span>
                        <strong>You</strong>
                        <time :datetime="message.createdAt" x-text="formatTime(message.createdAt)"></time>
                      </header>
                      <div class="chat-user-content">
                        <div class="answer-markdown" x-html="renderMarkdown(message.content)"></div>
                      </div>
                    </div>
                  </template>

                  <template x-if="message.role === 'assistant'">
                    <div class="chat-assistant-message">
                      <header>
                        <span class="chat-assistant-avatar">
                          <img alt="" aria-hidden="true" src="./assets/images/citeloom-mark.png" />
                        </span>
                        <strong>CiteLoom</strong>
                        <time :datetime="message.createdAt" x-text="formatTime(message.createdAt)"></time>
                        <div class="chat-response-actions">
                          <button
                            class="chat-response-speech-button"
                            type="button"
                            x-cloak
                            x-show="canUseMessageSpeech(message)"
                            :aria-label="messageSpeechActionLabel(message)"
                            :title="messageSpeechActionLabel(message)"
                            :disabled="messageSpeechLoading(message)"
                            @click="toggleMessageSpeech(message)"
                          >
                            <svg
                              aria-hidden="true"
                              class="citeloom-icon"
                              :class="{ spin: messageSpeechLoading(message) }"
                            >
                              <use :href="messageSpeechIcon(message)"></use>
                            </svg>
                            <span x-text="messageSpeechButtonLabel(message)"></span>
                          </button>
                        </div>
                      </header>
                      <div class="answer-content chat-assistant-content">
                        <div
                          class="answer-progress"
                          x-show="message.streaming === true &amp;&amp; messageAnswerStatements(message).length === 0"
                        >
                          <span class="answer-progress-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                          <span>Searching...</span>
                        </div>
                        <template x-for="(statement, statementIndex) in messageAnswerStatements(message)" :key="`${run.id}-statement-${statementIndex}`">
                          <div
                            class="chat-statement"
                            :class="[`chat-statement-${statement.presentation}`, `chat-statement-${statement.section}`]"
                          >
                            <h3
                              x-show="shouldShowStatementSectionHeading(message, statementIndex)"
                              x-text="statementSectionHeading(statement.section)"
                            ></h3>
                            <div class="chat-statement-body">
                              <span
                                class="chat-statement-number"
                                :class="`chat-statement-number-${statement.section}`"
                                x-show="statement.presentation === 'bullet'"
                                x-text="statementSectionNumber(message, statementIndex)"
                                aria-hidden="true"
                              ></span>
                              <div class="chat-statement-copy">
                                <div class="answer-markdown" x-html="statement.contentHtml"></div>
                                <div
                                  class="chat-statement-citations"
                                  x-show="statement.presentation === 'bullet' &amp;&amp; statement.citationKeys.length > 0"
                                >
                                  <template x-for="citationKey in statement.citationKeys" :key="citationKey">
                                    <button
                                      type="button"
                                      x-show="citationForKey(message, citationKey) !== null"
                                      :class="citationVerificationClasses(message, statement, citationKey)"
                                      x-text="citationLabel(citationForKey(message, citationKey))"
                                      :title="citationVerificationDescription(message, statement, citationKey)"
                                      :aria-label="statementCitationLabel(message, statement, citationKey)"
                                      :data-evidence-citation-id="citationForKey(message, citationKey)?.id"
                                      :data-evidence-claim-index="statement.verificationIndex"
                                      :data-evidence-message-id="message.id"
                                      aria-controls="evidence-window"
                                      :aria-expanded="(selectedCitation?.id === citationForKey(message, citationKey)?.id &amp;&amp; selectedEvidenceClaimIndex === statement.verificationIndex).toString()"
                                      :disabled="citationForKey(message, citationKey)?.preview === true"
                                      @click="openCitation(citationForKey(message, citationKey), $event.currentTarget, message, statement.verificationIndex)"
                                    ></button>
                                  </template>
                                </div>
                              </div>
                            </div>
                          </div>
                        </template>

                        <section
                          class="chat-answer-evidence"
                          x-show="message.streaming !== true &amp;&amp; message.citations.length > 0"
                        >
                          <header>
                            <strong>Evidence used in this answer</strong>
                            <span x-text="`· ${evidenceSources(message).length} ${evidenceSources(message).length === 1 ? 'source' : 'sources'}`"></span>
                          </header>
                          <div class="chat-answer-evidence-list">
                            <template x-for="(source, sourceIndex) in evidenceSources(message)" :key="source.citation.id">
                              <div class="chat-answer-evidence-row">
                                <span class="chat-answer-evidence-icon">
                                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg>
                                </span>
                                <span class="chat-answer-evidence-number" x-text="sourceIndex + 1"></span>
                                <strong x-text="sourceTitle(source.citation.sourceFile)"></strong>
                                <span x-show="source.pageNumbers.length > 0" x-text="sourcePageLabel(source)"></span>
                                <a
                                  :href="sourceFileUrl(source.citation)"
                                  target="_blank"
                                  rel="noopener noreferrer"
                                >
                                  <span>Open source</span>
                                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-external"></use></svg>
                                </a>
                              </div>
                            </template>
                          </div>
                        </section>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <div class="status-message chat-run-error error" role="status" x-show="run.state === 'failed' || run.state === 'canceled'">
                <strong x-text="runStatusLabel(run)"></strong>
                <span x-text="run.errorMessage ?? 'The request was canceled before a response was published.'"></span>
              </div>
            </article>
          </template>

        </div>

        <aside class="source-navigator chat-source-navigator" aria-label="Sources used in the active answer">
          <header>
            <h2 x-text="`Sources (${sourceSidebarCitations().length})`"></h2>
          </header>
          <div
            class="source-navigator-empty"
            x-cloak
            x-show="sourceSidebarCitations().length === 0"
          >
            <svg aria-hidden="true" class="citeloom-icon">
              <use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use>
            </svg>
            <strong>Sources will appear here</strong>
            <p>Citations become available as each answer is completed.</p>
          </div>
          <div
            class="source-navigator-list"
            x-cloak
            x-show="sourceSidebarCitations().length > 0"
          >
            <template x-for="(citation, sourceIndex) in sourceSidebarCitations()" :key="citation.id">
              <button
                type="button"
                :class="{ selected: selectedCitation?.id === citation.id }"
                :disabled="citation.preview === true"
                @click="openCitationFromNavigator(citation)"
              >
                <span class="source-navigator-number" x-text="citation.citationNumber ?? sourceIndex + 1"></span>
                <span
                  class="source-navigator-status"
                  :class="`source-navigator-status-${sourceNavigatorStatus(citation)}`"
                >
                  <span x-text="sourceNavigatorStatusLabel(citation)"></span>
                  <svg aria-hidden="true" class="citeloom-icon">
                    <use href="./assets/images/citeloom-icons.svg#citeloom-check-circle"></use>
                  </svg>
                </span>
              </button>
            </template>
          </div>
        </aside>

        <form class="chat-composer" @submit.prevent="sendMessage()">
          <label class="visually-hidden" for="chat-message">Message</label>
          <div class="chat-composer-shell" :class="{ 'dictation-active': chatDictationActive() }">
            <textarea
              id="chat-message"
              maxlength="8000"
              placeholder="Let's chat"
              rows="3"
              x-ref="messageComposer"
              x-model="draft"
              :disabled="busy || chatDictationActive()"
              @input="resizeMessageComposer()"
              @keydown.meta.enter.prevent="sendMessage()"
              @keydown.ctrl.enter.prevent="sendMessage()"
            ></textarea>
            <div class="chat-composer-utility-rail">
              <div
                class="chat-dictation-controls"
                aria-label="Voice input controls"
                x-cloak
                x-show="speechToTextEnabled"
              >
                <button
                  class="chat-composer-action"
                  type="button"
                  :disabled="busy"
                  x-show="dictationState === 'idle' || dictationState === 'error'"
                  @click="startChatDictation()"
                >
                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-microphone"></use></svg>
                  <span x-text="dictationState === 'error' ? 'Try dictation again' : 'Dictate'"></span>
                </button>
                <div class="chat-dictation-progress" x-show="dictationState === 'requesting'">
                  <svg aria-hidden="true" class="citeloom-icon spin"><use href="./assets/images/citeloom-icons.svg#citeloom-refresh"></use></svg>
                  <span>Waiting for microphone</span>
                  <button class="text-action" type="button" @click="cancelChatDictation()">Cancel</button>
                </div>
                <div class="chat-dictation-progress recording" x-show="dictationState === 'recording'">
                  <button class="chat-composer-action recording" type="button" @click="stopChatDictation()">
                    <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stop"></use></svg>
                    <span x-text="`Stop ${chatDictationElapsedLabel()}`"></span>
                  </button>
                  <button class="text-action" type="button" @click="cancelChatDictation()">Cancel</button>
                </div>
                <div class="chat-dictation-progress" x-show="dictationState === 'transcribing'">
                  <svg aria-hidden="true" class="citeloom-icon spin"><use href="./assets/images/citeloom-icons.svg#citeloom-refresh"></use></svg>
                  <span>Transcribing</span>
                  <button class="text-action" type="button" @click="cancelChatDictation()">Cancel</button>
                </div>
                <span class="visually-hidden" role="status" x-text="dictationStatus"></span>
              </div>
              <div class="chat-submit-controls">
                <button
                  class="chat-send-button"
                  type="submit"
                  :aria-label="busy ? 'Generating response' : 'Send message'"
                  :title="busy ? 'Generating response' : 'Send message'"
                  :disabled="busy || chatDictationActive() || draft.trim() === ''"
                >
                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-arrow"></use></svg>
                </button>
                <span class="chat-composer-shortcut">⌘ / Ctrl + Enter</span>
              </div>
            </div>
          </div>
        </form>
      </div>
    </template>
  </main>

  <audio
    aria-hidden="true"
    class="visually-hidden"
    preload="metadata"
    x-ref="chatSpeechAudio"
    @ended="speechAudioPlaying = false"
    @error="handleAnswerSpeechError()"
    @pause="speechAudioPlaying = false"
    @playing="speechAudioPlaying = true"
  ></audio>

  <div
    class="chat-switcher-backdrop"
    x-cloak
    x-show="chatSwitcherOpen"
    x-transition.opacity.duration.120ms
    @click.self="closeChatSwitcher()"
  >
    <section
      class="chat-switcher"
      role="dialog"
      aria-modal="true"
      aria-labelledby="chat-switcher-title"
    >
      <h2 class="visually-hidden" id="chat-switcher-title">Open a previous chat</h2>
      <div class="search-control chat-switcher-search">
        <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-search"></use></svg>
        <label class="visually-hidden" for="chat-switcher-search">Search previous chats</label>
        <input
          id="chat-switcher-search"
          type="search"
          placeholder="Search previous chats"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="chat-switcher-list"
          aria-expanded="true"
          :aria-activedescendant="chatSwitcherActiveDescendant()"
          x-ref="chatSwitcherSearch"
          x-model="chatSearchQuery"
          @input="resetChatSwitcherSelection()"
          @keydown.arrow-down.prevent="moveChatSwitcherSelection(1)"
          @keydown.arrow-up.prevent="moveChatSwitcherSelection(-1)"
          @keydown.enter.prevent="selectActiveChatFromSwitcher()"
        />
        <kbd>⌘ K</kbd>
        <kbd>Esc</kbd>
      </div>

      <div class="chat-switcher-content">
        <p class="chat-switcher-label">Recent chats</p>
        <div class="chat-switcher-list" id="chat-switcher-list" role="listbox">
          <template x-for="(item, itemIndex) in filteredConversations" :key="item.id">
            <button
              type="button"
              role="option"
              :id="chatSwitcherOptionId(itemIndex)"
              :aria-selected="(chatSwitcherActiveIndex === itemIndex).toString()"
              :class="{
                active: chatSwitcherActiveIndex === itemIndex,
                current: conversation?.id === item.id,
              }"
              @mouseenter="chatSwitcherActiveIndex = itemIndex"
              @click="selectConversationFromSwitcher(item.id)"
            >
              <span class="chat-switcher-row-icon">
                <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-ask"></use></svg>
              </span>
                <strong class="truncate" x-text="item.title"></strong>
              <span x-text="`${item.messageCount} messages`"></span>
              <time :datetime="item.updatedAt" x-text="formatRecency(item.updatedAt)"></time>
              <span class="chat-switcher-return" x-show="chatSwitcherActiveIndex === itemIndex">Return</span>
            </button>
          </template>
          <p class="chat-switcher-empty" x-show="filteredConversations.length === 0">No chats match your search.</p>
        </div>

        <button class="chat-switcher-new" type="button" @click="openNewChat()">
          <span class="chat-switcher-row-icon">
            <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-user-plus"></use></svg>
          </span>
          <strong class="truncate">New document chat</strong>
        </button>
      </div>

      <footer class="chat-switcher-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span>
        <span><kbd>Return</kbd> to open</span>
        <span><kbd>Esc</kbd> to close</span>
      </footer>
    </section>
  </div>

  <citeloom-evidence-window></citeloom-evidence-window>

  <div
    class="dialog-backdrop creation-modal-backdrop"
    x-cloak
    x-show="newChatOpen"
    @click.self="closeNewChat()"
    @keydown.escape.window="newChatOpen &amp;&amp; closeNewChat()"
  >
    <form class="dialog creation-modal" role="dialog" aria-modal="true" aria-labelledby="new-chat-title" @submit.prevent="createConversation()">
      <header class="creation-modal-header">
        <p class="section-kicker" id="new-chat-title">Create chat</p>
        <button class="icon-button creation-modal-close" type="button" aria-label="Close" @click="closeNewChat()">
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-close"></use></svg>
        </button>
      </header>

      <label class="form-field chat-title-field">
        <span>Chat title</span>
        <input
          x-ref="newChatTitle"
          maxlength="500"
          placeholder="My chat"
          required
          type="text"
          x-model="newChatTitle"
          @input="newChatErrorMessage = ''"
        />
      </label>

      <section class="chat-scope-selector" aria-labelledby="new-chat-scope-title">
        <h2 id="new-chat-scope-title">Choose sources</h2>
        <div class="chat-scope-list" role="radiogroup" aria-label="Chat source scope">
          <div class="chat-scope-card" :class="{ active: newChatScopeMode === 'all' }">
            <button
              class="chat-scope-card-trigger"
              type="button"
              role="radio"
              :aria-checked="(newChatScopeMode === 'all').toString()"
              @click="setNewChatScopeMode('all')"
            >
              <span class="chat-scope-radio" aria-hidden="true"></span>
              <svg aria-hidden="true" class="citeloom-icon chat-scope-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg>
              <span class="chat-scope-card-copy">
                <strong>All documents</strong>
                <small x-text="`Use all ${newChatTotalDocuments} indexed ${newChatTotalDocuments === 1 ? 'document' : 'documents'}`"></small>
              </span>
            </button>
          </div>

          <div class="chat-scope-card" :class="{ active: newChatScopeMode === 'tags' }">
            <button
              class="chat-scope-card-trigger"
              type="button"
              role="radio"
              :aria-checked="(newChatScopeMode === 'tags').toString()"
              :aria-expanded="(newChatScopeMode === 'tags').toString()"
              aria-controls="new-chat-tag-options"
              @click="setNewChatScopeMode('tags')"
            >
              <span class="chat-scope-radio" aria-hidden="true"></span>
              <svg aria-hidden="true" class="citeloom-icon chat-scope-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use></svg>
              <span class="chat-scope-card-copy">
                <strong>Documents with selected tags</strong>
                <small>Build a scope from the tags in your document library</small>
              </span>
              <svg aria-hidden="true" class="citeloom-icon chat-scope-caret"><use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use></svg>
            </button>
            <div class="chat-scope-details" id="new-chat-tag-options" x-show="newChatScopeMode === 'tags'">
              <div class="chat-scope-details-header">
                <div>
                  <strong>Select tags</strong>
                  <small>Includes documents matching any selected tag.</small>
                </div>
                <button type="button" x-show="newChatSelectedTags.length > 0" @click="clearNewChatTags()">Clear</button>
              </div>
              <label class="chat-scope-search">
                <span class="visually-hidden">Search tags</span>
                <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-search"></use></svg>
                <input type="search" placeholder="Search tags" x-model="newChatTagSearch" />
              </label>
              <div class="chat-scope-tag-list">
                <template x-for="facet in filteredNewChatTags" :key="facet.tag">
                  <button
                    class="chat-scope-tag-row"
                    type="button"
                    :aria-pressed="isNewChatTagSelected(facet.tag).toString()"
                    @click="toggleNewChatTag(facet.tag)"
                  >
                    <span class="chat-scope-checkbox" :class="{ checked: isNewChatTagSelected(facet.tag) }">
                      <svg aria-hidden="true" class="citeloom-icon" x-show="isNewChatTagSelected(facet.tag)"><use href="./assets/images/citeloom-icons.svg#citeloom-check"></use></svg>
                    </span>
                    <span x-text="facet.tag"></span>
                    <small x-text="facet.count"></small>
                  </button>
                </template>
                <p class="chat-scope-empty" x-show="!newChatCatalogLoading &amp;&amp; filteredNewChatTags.length === 0">No tags match this search.</p>
              </div>
            </div>
          </div>

          <div class="chat-scope-card" :class="{ active: newChatScopeMode === 'documents' }">
            <button
              class="chat-scope-card-trigger"
              type="button"
              role="radio"
              :aria-checked="(newChatScopeMode === 'documents').toString()"
              :aria-expanded="(newChatScopeMode === 'documents').toString()"
              aria-controls="new-chat-document-options"
              @click="setNewChatScopeMode('documents')"
            >
              <span class="chat-scope-radio" aria-hidden="true"></span>
              <svg aria-hidden="true" class="citeloom-icon chat-scope-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-search"></use></svg>
              <span class="chat-scope-card-copy">
                <strong>Specific documents</strong>
                <small>Search and choose individual files</small>
              </span>
              <svg aria-hidden="true" class="citeloom-icon chat-scope-caret"><use href="./assets/images/citeloom-icons.svg#citeloom-caret-right"></use></svg>
            </button>
            <div class="chat-scope-details" id="new-chat-document-options" x-show="newChatScopeMode === 'documents'">
              <label class="chat-scope-search">
                <span class="visually-hidden">Search documents</span>
                <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-search"></use></svg>
                <input
                  type="search"
                  placeholder="Search documents"
                  x-model="newChatDocumentSearch"
                  @input.debounce.250ms="loadNewChatDocumentOptions()"
                />
              </label>
              <div class="chat-scope-filters" aria-label="Filter documents by tag">
                <button
                  type="button"
                  :class="{ active: newChatDocumentTag === '' }"
                  :aria-pressed="(newChatDocumentTag === '').toString()"
                  @click="setNewChatDocumentTag('')"
                >All</button>
                <template x-for="facet in newChatTagOptions" :key="facet.tag">
                  <button
                    type="button"
                    :class="{ active: newChatDocumentTag === facet.tag }"
                    :aria-pressed="(newChatDocumentTag === facet.tag).toString()"
                    @click="setNewChatDocumentTag(facet.tag)"
                  >
                    <span x-text="facet.tag"></span>
                    <small x-text="facet.count"></small>
                  </button>
                </template>
              </div>
              <div class="chat-scope-bulk-actions">
                <button type="button" :disabled="newChatDocumentOptions.length === 0" @click="selectNewChatDocumentOptions()">Select shown</button>
                <button type="button" x-show="newChatSelectedDocuments.length > 0" @click="clearNewChatDocuments()">Clear</button>
              </div>
              <div class="chat-scope-document-list">
                <template x-for="document in newChatDocumentOptions" :key="document.sourceFile">
                  <button
                    class="chat-scope-document-row"
                    type="button"
                    :aria-pressed="isNewChatDocumentSelected(document.sourceFile).toString()"
                    :title="document.sourceFile"
                    @click="toggleNewChatDocument(document)"
                  >
                    <span class="chat-scope-checkbox" :class="{ checked: isNewChatDocumentSelected(document.sourceFile) }">
                      <svg aria-hidden="true" class="citeloom-icon" x-show="isNewChatDocumentSelected(document.sourceFile)"><use href="./assets/images/citeloom-icons.svg#citeloom-check"></use></svg>
                    </span>
                    <svg aria-hidden="true" class="citeloom-icon chat-scope-document-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg>
                    <span class="truncate" x-text="sourceTitle(document.sourceFile)"></span>
                    <span class="chat-scope-document-tags">
                      <template x-for="tag in newChatDocumentTags(document)" :key="tag">
                        <small x-text="tag"></small>
                      </template>
                    </span>
                  </button>
                </template>
                <p class="chat-scope-empty" x-show="!newChatCatalogLoading &amp;&amp; newChatDocumentOptions.length === 0">No documents match these filters.</p>
                <button
                  class="chat-scope-load-more"
                  type="button"
                  x-show="newChatCanLoadMoreDocuments"
                  :disabled="newChatCatalogLoading"
                  @click="loadNewChatDocumentOptions({ append: true })"
                >Load more documents</button>
              </div>
            </div>
          </div>
        </div>

        <section class="chat-scope-summary" aria-live="polite">
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-check-circle"></use></svg>
          <span>
            <strong x-text="newChatScopeSummaryTitle"></strong>
            <small x-text="newChatScopeSummaryDetail"></small>
          </span>
        </section>

        <button
          class="chat-scope-review-toggle"
          type="button"
          :disabled="newChatIncludedDocuments.length === 0"
          :aria-expanded="newChatReviewOpen.toString()"
          aria-controls="new-chat-included-documents"
          @click="newChatReviewOpen = !newChatReviewOpen"
        >
          <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-stack"></use></svg>
          <span x-text="newChatReviewOpen ? 'Hide included documents' : 'Review included documents'"></span>
        </button>
        <div class="chat-scope-review" id="new-chat-included-documents" x-show="newChatReviewOpen">
          <div class="chat-scope-document-list">
            <template x-for="document in newChatIncludedDocuments" :key="document.sourceFile">
              <div class="chat-scope-document-row review">
                <svg aria-hidden="true" class="citeloom-icon chat-scope-document-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-documents"></use></svg>
                <span class="truncate" :title="document.sourceFile" x-text="sourceTitle(document.sourceFile)"></span>
                <span class="chat-scope-document-tags">
                  <template x-for="tag in newChatDocumentTags(document)" :key="tag">
                    <small x-text="tag"></small>
                  </template>
                </span>
                <button
                  class="chat-scope-remove"
                  type="button"
                  x-show="newChatScopeMode === 'documents'"
                  :aria-label="`Remove ${sourceTitle(document.sourceFile)}`"
                  @click="removeNewChatDocument(document.sourceFile)"
                >
                  <svg aria-hidden="true" class="citeloom-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-close"></use></svg>
                </button>
              </div>
            </template>
            <button
              class="chat-scope-load-more"
              type="button"
              x-show="newChatCanLoadMorePreview"
              :disabled="newChatPreviewLoading"
              @click="loadNewChatPreview({ append: true })"
            >Load more included documents</button>
          </div>
        </div>
      </section>

      <p class="creation-modal-error" role="alert" x-show="newChatErrorMessage !== ''" x-text="newChatErrorMessage"></p>

      <footer class="dialog-actions creation-modal-actions">
        <button class="button secondary" type="button" :disabled="busy" @click="closeNewChat()">Cancel</button>
        <button class="button primary" type="submit" :disabled="busy || newChatCatalogLoading || !newChatCanCreate">
          <svg aria-hidden="true" class="citeloom-icon citeloom-small-icon"><use href="./assets/images/citeloom-icons.svg#citeloom-ask"></use></svg>
          <span x-text="busy ? 'Creating…' : 'Create chat'"></span>
        </button>
      </footer>
    </form>
  </div>
</section>
