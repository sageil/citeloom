<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 1024"
  fill="none"
  preserveAspectRatio="xMidYMid slice"
>
  <defs>
    <filter id="pulse-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .network-line {
      stroke: #64748b;
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 12 18;
      stroke-opacity: 0.22;
      vector-effect: non-scaling-stroke;
      animation: weave-flow 24s linear infinite;
    }

    .network-line:nth-of-type(even) {
      animation-direction: reverse;
      animation-duration: 29s;
    }

    .network-node {
      fill: #94a3b8;
      opacity: 0.28;
      transform-box: fill-box;
      transform-origin: center;
      animation: node-breathe 6s ease-in-out infinite;
    }

    .network-node--accent {
      fill: #06b6d4;
      opacity: 0.5;
    }

    .node-delay-one {
      animation-delay: -2s;
    }

    .node-delay-two {
      animation-delay: -4s;
    }

    .knowledge-icon {
      fill: #67e8f9;
      opacity: 0.24;
      animation: icon-breathe 8s ease-in-out infinite;
    }

    .icon-delay-one {
      animation-delay: -2.6s;
    }

    .icon-delay-two {
      animation-delay: -5.2s;
    }

    .pulse-traveler {
      fill: #67e8f9;
      opacity: 0.88;
    }

    @keyframes weave-flow {
      to {
        stroke-dashoffset: -240;
      }
    }

    @keyframes node-breathe {
      0%, 100% {
        opacity: 0.16;
        transform: scale(0.82);
      }
      50% {
        opacity: 0.48;
        transform: scale(1.16);
      }
    }

    @keyframes icon-breathe {
      0%, 100% {
        opacity: 0.14;
      }
      50% {
        opacity: 0.34;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .network-line,
      .network-node,
      .knowledge-icon {
        animation: none;
      }

      .pulse-traveler {
        display: none;
      }
    }
  </style>

  <g aria-hidden="true">
    <path class="network-line" d="M-24 188 142 118 286 176 446 72 620 150 754 108" />
    <path class="network-line" d="M760 108 916 68 1072 156 1244 96 1464 180" />
    <path class="network-line" d="M38 178 82 352 30 530 94 704 34 884" />
    <path class="network-line" d="M1402 166 1354 342 1418 520 1348 694 1410 882" />
