    <circle class="pulse-traveler" r="4" filter="url(#pulse-glow)">
      <animateMotion
        begin="-9s"
        dur="18s"
        path="M1402 166 1354 342 1418 520 1348 694 1410 882"
        repeatCount="indefinite"
      />
    </circle>
  </g>
</svg>
