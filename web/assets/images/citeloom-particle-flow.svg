    <circle class="pulse-traveler" r="5" filter="url(#pulse-glow)">
      <animateMotion
        dur="13s"
        path="M-24 188 142 118 286 176 446 72 620 150 754 108"
        repeatCount="indefinite"
      />
    </circle>
    <circle class="pulse-traveler" r="4.5" filter="url(#pulse-glow)">
      <animateMotion
        begin="-5s"
        dur="15s"
        path="M790 950 948 886 1112 958 1268 900 1464 956"
        repeatCount="indefinite"
