name: Bug report
description: Report a reproducible problem with CiteLoom.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting a new report.
        Do not include credentials, private document content, or other sensitive information.
        Report security vulnerabilities through [private vulnerability reporting](https://github.com/sageil/citeloom/security/advisories/new), not through a public issue.

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the part of CiteLoom where the problem occurs.
      options:
        - Document ingestion and indexing
        - Retrieval and search
        - Ask, citations, and HHEM
        - Chat and research
        - Web interface, authentication, and settings
        - CLI and worker
        - Model providers
        - Deployment, backup, and restore
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CiteLoom version
      description: Provide the release version or commit SHA where the problem occurs.
      placeholder: "Example: 0.2.1 or bf248d7"
    validations:
      required: true

  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      options:
        - Published Docker images
        - Local Docker build
        - Source checkout
        - Other
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system and architecture
      description: Include the operating system version and CPU architecture.
      placeholder: "Example: macOS 15 on Apple silicon or Ubuntu 24.04 on amd64"
    validations:
      required: true

  - type: textarea
    id: providers-and-models
    attributes:
      label: Relevant providers and models
      description: List the provider, endpoint type, and model involved, if applicable.
      placeholder: "Example: Ollama with qwen3.5:9b-mlx for answers"

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe the problem and its effect on your workflow.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected CiteLoom to do.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what CiteLoom did instead, including exact error messages when available.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste only sanitized logs that help explain the problem.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, traces, configuration details, or other sanitized context.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, private document content, and other sensitive information.
          required: true
        - label: This is not a security vulnerability. I will use private vulnerability reporting for security issues.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/sageil/citeloom/blob/main/CODE_OF_CONDUCT.md).
          required: true
