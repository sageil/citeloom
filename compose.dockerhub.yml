# Set CITELOOM_ADMIN_USERNAME and CITELOOM_ADMIN_PASSWORD in .env before starting.
# If the browser requires manual certificate import, use data/caddy/caddy/pki/authorities/local/root.crt.
# Keep the rest of data/caddy private because it contains the local certificate authority keys.

name: citeloom

x-citeloom-image: &citeloom-image sageil/citeloom:${CITELOOM_IMAGE_TAG:-1.0.0}

services:
  postgres:
    image: sageil/citeloom-postgres:${CITELOOM_IMAGE_TAG:-1.0.0}
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: citeloom
      POSTGRES_PASSWORD: citeloom
      POSTGRES_USER: citeloom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${CITELOOM_POSTGRES_DATA_DIRECTORY:-./data/citeloomdb}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeloom -d citeloom"]
      interval: 10s
      timeout: 5s
      retries: 12

  docling:
    image: sageil/citeloom-docling:${CITELOOM_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    environment:
      CITELOOM_DOCLING_CHECKPOINT_DIRECTORY: /app/docling-checkpoints
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data/docling-checkpoints/docling:/app/docling-checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5001/ready'))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  docling-replica:
    image: sageil/citeloom-docling:${CITELOOM_IMAGE_TAG:-1.0.0}
    profiles: ["docling-scale"]
    restart: unless-stopped
    environment:
      CITELOOM_DOCLING_CHECKPOINT_DIRECTORY: /app/docling-checkpoints
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5003:5001"
    volumes:
      - ./data/docling-checkpoints/docling-replica:/app/docling-checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5001/ready'))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  hhem:
    image: sageil/citeloom-hhem:${CITELOOM_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HHEM_PORT:-8088}:8080"
    volumes:
      - hhem-models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = json.load(urllib.request.urlopen('http://127.0.0.1:8080/ready')); assert response['status'] == 'ready' and response['model'] == 'vectara/hallucination_evaluation_model' and response['revision'] == '8e4a2e6e96c708cc76c2344f7e4757df2515292c'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 10s

  migrate:
    image: *citeloom-image
    command: ["node", "dist/database/migrate.js"]
    environment:
      CITELOOM_ADMIN_PASSWORD: ${CITELOOM_ADMIN_PASSWORD:?Set CITELOOM_ADMIN_PASSWORD in .env}
      CITELOOM_ADMIN_USERNAME: ${CITELOOM_ADMIN_USERNAME:?Set CITELOOM_ADMIN_USERNAME in .env}
      CITELOOM_SOURCE_CONTENT_DIRECTORY: /app/documents/blobs
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs

  worker:
    image: *citeloom-image
    command: ["node", "dist/cli/index.js", "worker"]
    environment:
      CITELOOM_RELEASE: ${CITELOOM_RELEASE:-1.0.0}
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      docling:
        condition: service_healthy
      hhem:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs
    healthcheck:
      test: ["CMD", "node", "dist/cli/index.js", "status"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 20s

  web:
    image: *citeloom-image
    command: ["node", "dist/web-server.js"]
    environment:
      CITELOOM_RELEASE: ${CITELOOM_RELEASE:-1.0.0}
      CITELOOM_UPLOAD_DIRECTORY: /app/documents/uploads
      CITELOOM_WEB_HOST: 0.0.0.0
      CITELOOM_WEB_PORT: "3000"
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    volumes:
      - ./documents/uploads:/app/documents/uploads
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      docling:
        condition: service_healthy
      hhem:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.CITELOOM_WEB_PORT + '/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 20s

  https-proxy:
    image: caddy:2.11.4-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:3443:3443"
      - "127.0.0.1:3080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--output-document=/dev/null", "https://localhost:3443/"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 10s

volumes:
  hhem-models:
