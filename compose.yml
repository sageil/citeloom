name: citeloom

x-app-build: &app-build
  context: .
  dockerfile: infra/Dockerfile

x-postgres-build: &postgres-build
  context: .
  dockerfile: infra/postgres/Dockerfile

x-hhem-build: &hhem-build
  context: .
  dockerfile: infra/hhem/Dockerfile

x-docling-build: &docling-build
  context: .
  dockerfile: infra/docling/Dockerfile

x-docling-image: &docling-image citeloom/docling-serve-cpu:1.27.0-ppocrv5-2d2fd797

services:
  postgres:
    build: *postgres-build
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: citeloom
      POSTGRES_PASSWORD: citeloom
      POSTGRES_USER: citeloom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${CITELOOM_POSTGRES_DATA_DIRECTORY:-./data/citeloomdb}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeloom -d citeloom"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-test:
    build: *postgres-build
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    profiles: ["test"]
    environment:
      POSTGRES_DB: citeloom_test
      POSTGRES_PASSWORD: citeloom
      POSTGRES_USER: citeloom
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeloom -d citeloom_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  docling:
    build: *docling-build
    image: *docling-image
    restart: unless-stopped
    environment:
      CITELOOM_DOCLING_CHECKPOINT_DIRECTORY: /app/docling-checkpoints
      CITELOOM_SOURCE_CONTENT_DIRECTORY: /app/documents/blobs
      DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS: ${DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS:-false}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      DOCLING_PERF_PAGE_BATCH_SIZE: ${DOCLING_PERF_PAGE_BATCH_SIZE:-4}
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 1
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "false"
      DOCLING_SERVE_QUEUE_MAX_SIZE: ${DOCLING_SERVE_QUEUE_MAX_SIZE:-8}
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data/docling-checkpoints/docling:/app/docling-checkpoints
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5001/ready'))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  docling-replica:
    build: *docling-build
    image: *docling-image
    profiles: ["docling-scale"]
    restart: unless-stopped
    environment:
      CITELOOM_DOCLING_CHECKPOINT_DIRECTORY: /app/docling-checkpoints
      CITELOOM_SOURCE_CONTENT_DIRECTORY: /app/documents/blobs
      DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS: ${DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS:-false}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      DOCLING_PERF_PAGE_BATCH_SIZE: ${DOCLING_PERF_PAGE_BATCH_SIZE:-4}
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 1
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "false"
      DOCLING_SERVE_QUEUE_MAX_SIZE: ${DOCLING_SERVE_QUEUE_MAX_SIZE:-8}
    ports:
      - "127.0.0.1:5003:5001"
    volumes:
      - ./data/docling-checkpoints/docling-replica:/app/docling-checkpoints
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5001/ready'))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  hhem:
    build: *hhem-build
    restart: unless-stopped
    init: true
    environment:
      HHEM_MAX_PADDED_TOKENS: ${HHEM_MAX_PADDED_TOKENS:-20000}
      HHEM_MAX_ATTENTION_CELLS: ${HHEM_MAX_ATTENTION_CELLS:-20000000}
      HHEM_MODEL_BATCH_SIZE: ${HHEM_MODEL_BATCH_SIZE:-20}
      HHEM_TORCH_THREADS: ${HHEM_TORCH_THREADS:-4}
    ports:
      - "127.0.0.1:${HHEM_PORT:-8088}:8080"
    volumes:
      - hhem-models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = json.load(urllib.request.urlopen('http://127.0.0.1:8080/ready')); assert response['status'] == 'ready' and response['model'] == 'vectara/hallucination_evaluation_model' and response['revision'] == '8e4a2e6e96c708cc76c2344f7e4757df2515292c'"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 10s

  migrate:
    build: *app-build
    command: ["node", "dist/database/migrate.js"]
    environment:
      CITELOOM_ADMIN_PASSWORD: ${CITELOOM_ADMIN_PASSWORD:-}
      CITELOOM_ADMIN_USERNAME: ${CITELOOM_ADMIN_USERNAME:-}
      CITELOOM_SOURCE_CONTENT_DIRECTORY: /app/documents/blobs
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs

  worker:
    build: *app-build
    command: ["node", "dist/cli/index.js", "worker"]
    environment:
      CITELOOM_RELEASE: ${CITELOOM_RELEASE:-0.2.3}
      CITELOOM_APPLICATION_ERROR_MAXIMUM_ROWS: ${CITELOOM_APPLICATION_ERROR_MAXIMUM_ROWS:-100000}
      CITELOOM_APPLICATION_ERROR_RETENTION_DAYS: ${CITELOOM_APPLICATION_ERROR_RETENTION_DAYS:-30}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
      DOCLING_ADDITIONAL_SERVICE_INSTANCES: ${DOCLING_CONTAINER_ADDITIONAL_SERVICE_INSTANCES:-[]}
      DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS: ${DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS:-false}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      DOCLING_PERF_PAGE_BATCH_SIZE: ${DOCLING_PERF_PAGE_BATCH_SIZE:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      docling:
        condition: service_healthy
      hhem:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs
    healthcheck:
      test: ["CMD", "node", "dist/cli/index.js", "status"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 20s

  web:
    build: *app-build
    command: ["node", "dist/web-server.js"]
    environment:
      CITELOOM_RELEASE: ${CITELOOM_RELEASE:-0.2.3}
      CITELOOM_APPLICATION_ERROR_MAXIMUM_ROWS: ${CITELOOM_APPLICATION_ERROR_MAXIMUM_ROWS:-100000}
      CITELOOM_APPLICATION_ERROR_RETENTION_DAYS: ${CITELOOM_APPLICATION_ERROR_RETENTION_DAYS:-30}
      CITELOOM_MAX_UPLOAD_REQUEST_MEGABYTES: ${CITELOOM_MAX_UPLOAD_REQUEST_MEGABYTES:-100}
      CITELOOM_PUBLIC_ORIGIN: ${CITELOOM_PUBLIC_ORIGIN:-https://localhost:3443}
      CITELOOM_SECURE_SESSION_COOKIE: ${CITELOOM_SECURE_SESSION_COOKIE:-true}
      CITELOOM_UPLOAD_DIRECTORY: /app/documents/uploads
      CITELOOM_TRUST_PROXY: "true"
      CITELOOM_WEB_HOST: 0.0.0.0
      CITELOOM_WEB_PORT: "3000"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_URL: postgresql://citeloom:citeloom@postgres:5432/citeloom
      DOCLING_ADDITIONAL_SERVICE_INSTANCES: ${DOCLING_CONTAINER_ADDITIONAL_SERVICE_INSTANCES:-[]}
      DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS: ${DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS:-false}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      DOCLING_PERF_PAGE_BATCH_SIZE: ${DOCLING_PERF_PAGE_BATCH_SIZE:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    volumes:
      - ./documents/uploads:/app/documents/uploads
      - ${CITELOOM_SOURCE_CONTENT_HOST_DIRECTORY:-./documents/blobs}:/app/documents/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      docling:
        condition: service_healthy
      hhem:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.CITELOOM_WEB_PORT + '/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 20s

  https-proxy:
    image: caddy:2.11.4-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:3443:3443"
      - "127.0.0.1:3080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--output-document=/dev/null", "https://localhost:3443/"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 10s

volumes:
  hhem-models:
